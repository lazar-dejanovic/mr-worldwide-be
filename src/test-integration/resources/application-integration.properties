# Datasource is injected dynamically by CucumberSpringConfiguration.PostgresInitializer
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=legacy

app.scheduling.enable=false
spring.liquibase.enabled=false

# Dummy values so auto-configurations don't fail ? real clients are @MockitoBean
amadeus.api.key=test
amadeus.api.secret=test
stayapi.api.key=test
foursquare.api.key=test
spring.ai.openai.api-key=test

# Actuator
management.endpoints.web.exposure.include=health

