server.port=8080
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
app.scheduling.enable=false
#app.scheduling.enable=true

# Amadeus API
amadeus.api.key=${AMADEUS_API_KEY:}
amadeus.api.secret=${AMADEUS_API_SECRET:}
amadeus.api.base-url=https://test.api.amadeus.com

# StayAPI
stayapi.api.key=${STAYAPI_API_KEY:}
stayapi.base-url=https://api.stayapi.com

# Foursquare
foursquare.api.key=${FOURSQUARE_API_KEY:}
foursquare.base-url=https://places-api.foursquare.com

# Spring AI / OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o

# Vehicle route calculation defaults
route.fuel-cost-per-km=0.12
route.toll-cost-per-km=0.05
